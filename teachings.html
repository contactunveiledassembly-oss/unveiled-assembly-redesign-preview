<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Teachings, classes, and spiritual formation resources from The Unveiled Assembly of Christ Jesus." />
  <title>Teachings | The Unveiled Assembly</title>
  <link rel="icon" type="image/png" href="assets/ua-logo-tight.png" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=owner-oneonone-20260912" />
</head>
<body data-page="teachings">
  <div class="grain"></div>

  <header class="teaching-hero" id="teachingHero">
    <div class="teaching-hero-content reveal"><div class="eyebrow">Teachings</div><h1 class="teaching-display">Loading…</h1></div>
  </header>

  <section class="teaching-cards-section" id="teachingCardsSection">
    <div class="section-inner">
      <div class="eyebrow reveal" style="margin-bottom:6px">Thursday Teachings</div>
      <h2 class="teaching-display reveal teaching-section-title">Upcoming Teachings.</h2>
      <p class="reveal teaching-cards-subhead" id="teachingCardsSubhead" style="color:var(--stone);margin-bottom:44px">Every Thursday</p>
      <div class="teaching-cards-grid reveal" id="teachingCardsList"></div>
    </div>
  </section>

  <section class="teaching-library-section" id="teachingLibrarySection" hidden>
    <div class="section-inner">
      <div class="eyebrow reveal" style="margin-bottom:24px">Teaching Library</div>
      <h2 class="teaching-display reveal teaching-section-title">Watch &amp; Revisit.</h2>
      <div class="teaching-cards-grid reveal" id="teachingLibraryList"></div>
    </div>
  </section>

  <section class="teaching-scripture-section" id="teachingScriptureSection">
    <div class="teaching-scripture-grid reveal">
      <div class="teaching-scripture-art"></div>
      <div class="teaching-scripture-copy">
        <div class="eyebrow on-light" style="margin-bottom:20px">The Foundation</div>
        <p class="teaching-scripture-verse" id="teachingScriptureVerse"></p>
        <span class="teaching-scripture-ref" id="teachingScriptureRef"></span>
      </div>
    </div>
  </section>

  <section class="on-light-section teaching-newsletter-section" id="teachingNewsletterSection">
    <div class="section-inner reveal" style="text-align:center;max-width:640px">
      <div class="eyebrow on-light" style="margin-bottom:20px">Stay Connected</div>
      <h2 class="teaching-subtitle-heading" style="font-size:clamp(28px,3.6vw,42px);margin-bottom:20px">Never miss a Thursday teaching.</h2>
      <p style="margin-bottom:30px">New teachings are announced first on Instagram and by email — reach out on Connect to be added.</p>
      <a class="btn on-light fill" href="connect.html">Get Notified →</a>
    </div>
  </section>

  <script type="module" src="app.js?v=owner-oneonone-20260912"></script>
</body>
</html>
